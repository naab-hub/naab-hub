name: Refresh public activity
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - '.github/workflows/public-activity.yml'
      - 'scripts/**'
      - 'tests/**'
permissions:
  contents: write
concurrency:
  group: naab-public-activity
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Test, refresh and publish cards
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Regenerate from the latest branch tip on each attempt so that
          # concurrent edits never require a force-push or an SVG merge.
          for attempt in 1 2 3; do
            git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH"
            base_commit=$(git rev-parse FETCH_HEAD)
            git switch --detach "$base_commit"

            python3 -m unittest discover -s tests -v
            python3 scripts/update_stats.py
            git add -- assets/naab-activity.svg assets/naab-activity-mobile.svg
            if git diff --cached --quiet; then
              echo 'Activity cards already current.'
              exit 0
            fi
            git commit -m 'chore: refresh public activity cards'
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi

            git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH"
            if [ "$(git rev-parse FETCH_HEAD)" = "$base_commit" ]; then
              echo 'Push failed without a branch update. Check permissions or repository rules.' >&2
              exit 1
            fi
            echo "Remote branch advanced during attempt $attempt; regenerating on the latest commit."
            sleep 2
          done
          echo 'Remote branch kept advancing; refresh aborted without overwriting any commits.' >&2
          exit 1
